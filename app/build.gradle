plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tenix.svault'
    compileSdk 34

    defaultConfig {
        applicationId "com.tenix.svault"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled false   // single classes.dex
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // No external dependencies — single DEX guaranteed
}
