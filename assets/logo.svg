<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="moddaLogoTitle">
  <title id="moddaLogoTitle">Modda</title>
  <defs>
    <linearGradient id="moddaAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
  </defs>
  <!-- Segment A: upper-left shaft block -->
  <rect x="20" y="8" width="11" height="19" rx="2.5" fill="currentColor"/>
  <!-- Segment B: lower-right shaft block, offset = the "modification" step -->
  <rect x="31" y="29" width="11" height="10" rx="2.5" fill="currentColor"/>
  <!-- Arrowhead: shaft resolves into a download chevron -->
  <path d="M20 43 L44 43 L32 57 Z" fill="url(#moddaAccent)"/>
</svg>
